name: Build APK v2

on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot + Templates
        run: |
          mkdir -p $HOME/godot $HOME/.local/share/godot/export_templates/4.4.1.stable
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d $HOME/godot
          chmod +x $HOME/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -sL -o /tmp/tp.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/tp.zip -d /tmp/tpl
          mv /tmp/tpl/templates/* $HOME/.local/share/godot/export_templates/4.4.1.stable/
          ls $HOME/.local/share/godot/export_templates/4.4.1.stable/ | head -4

      - name: Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools /tmp/cli
          curl -sL -o /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cli.zip -d /tmp/cli
          mv /tmp/cli/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Keystore + Settings
        run: |
          mkdir -p $HOME/.android $HOME/.config/godot
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s/android-sdk"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/build_tools = "34.0.0"\n' "$HOME" "$JAVA_HOME" "$HOME" > $HOME/.config/godot/editor_settings-4.4.tres

      - name: Repair project files
        run: |
          printf 'config_version=5\n\n[application]\n\nconfig/name="ElahAlKhalq"\nrun/main_scene="res://scenes/Main.tscn"\nconfig/features=PackedStringArray("4.4", "Mobile")\n\n[display]\n\nwindow/size/viewport_width=1280\nwindow/size/viewport_height=720\nwindow/handheld/orientation=4\n\n[internationalization]\n\nrendering/root_node_layout_direction=3\n\n[rendering]\n\nrenderer/rendering_method="mobile"\n' > project.godot
          mkdir -p scenes
          printf '[gd_scene load_steps=2 format=3]\n\n[ext_resource type="Script" path="res://scripts/main.gd" id="1"]\n\n[node name="Main" type="Node2D"]\nscript = ExtResource("1")\n' > scenes/Main.tscn
          printf '[preset.0]\n\nname="Android"\nplatform="Android"\nrunnable=true\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/elah-alkhalq.apk"\n\n[preset.0.options]\n\narchitectures/armeabi-v7a=true\narchitectures/arm64-v8a=true\ngradle_build/use_gradle_build=false\nkeystore/debug=""\nversion/code=1\nversion/name="1.0.0"\npackage/unique_name="com.elahkhalq.game"\npackage/name="ElahAlKhalq"\npackage/signed=true\nscreen/orientation=4\npermissions/internet=false\n' > export_presets.cfg
          echo "=== VERIFY ==="
          head -3 project.godot
          cat scenes/Main.tscn
          head -4 export_presets.cfg

      - name: Import
        run: timeout 240 $HOME/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --quit --path . || true

      - name: Export
        run: |
          mkdir -p build
          $HOME/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/elah-alkhalq.apk 2>&1 | tee /tmp/export.log || true
          echo "=== EXPORT LOG (last 40 lines) ==="
          tail -40 /tmp/export.log
          echo "=== BUILD DIR ==="
          ls -la build/
          test -f build/elah-alkhalq.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elah-AlKhalq-APK
          path: build/*.apk
          if-no-files-found: error
