      - name: Repair project files
        run: |
          printf 'config_version=5\n\n[application]\n\nconfig/name="إله الخلق"\nrun/main_scene="res://scenes/Main.tscn"\nconfig/features=PackedStringArray("4.3", "Mobile")\n\n[display]\n\nwindow/size/viewport_width=1280\nwindow/size/viewport_height=720\nwindow/handheld/orientation=4\n\n[internationalization]\n\nrendering/root_node_layout_direction=3\n\n[rendering]\n\nrenderer/rendering_method="mobile"\n' > project.godot
          mkdir -p scenes
          printf '[gd_scene load_steps=2 format=3]\n\n[ext_resource type="Script" path="res://scripts/main.gd" id="1"]\n\n[node name="Main" type="Node2D"]\nscript = ExtResource("1")\n' > scenes/Main.tscn
          printf '[preset.0]\n\nname="Android"\nplatform="Android"\nrunnable=true\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/elah-alkhalq.apk"\n\n[preset.0.options]\n\narchitectures/armeabi-v7a=true\narchitectures/arm64-v8a=true\ngradle_build/use_gradle_build=false\nkeystore/debug=""\nversion/code=1\nversion/name="1.0.0"\npackage/unique_name="com.elahkhalq.game"\npackage/name="إله الخلق"\npackage/signed=true\nscreen/orientation=4\npermissions/internet=false\n' > export_presets.cfg
          echo "=== VERIFY FILES ==="
          head -3 project.godot
          cat scenes/Main.tscn
          head -4 export_presets.cfg
