name: Build APK v2

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Download & Setup Godot 4.3
        run: |
          mkdir -p $HOME/godot
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d $HOME/godot
          chmod +x $HOME/godot/Godot_v4.3-stable_linux.x86_64
          
          # Templates
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          curl -sL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/tpl
          mv /tmp/tpl/templates/* $HOME/.local/share/godot/export_templates/4.3.stable/

      - name: Generate Debug Keystore & Editor Settings
        run: |
          mkdir -p $HOME/.android $HOME/.config/godot
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # إعداد Editor Settings مع المسارات المطلقة الصحيحة
          cat <<EOF > $HOME/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Fix scripts
        run: |
          sed -i 's/:=/=/g' scripts/*.gd || true

      - name: Build APK
        run: |
          mkdir -p build
          # استيراد موارد المشروع وتحضير بيئة Godot
          $HOME/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --quit --path . || true
          
          # تصدير APK
          $HOME/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/elah-alkhalq.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elah-alkhalq-apk
          path: build/elah-alkhalq.apk
          if-no-files-found: error
