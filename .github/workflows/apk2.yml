name: Build APK v2

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages & Start ADB
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          # إضافة ADB و SDK للـ PATH العام
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          $ANDROID_HOME/platform-tools/adb start-server || true

      - name: Setup Keystore & Godot Config
        run: |
          mkdir -p $HOME/.android $HOME/.config/godot
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # تهيئة Editor Settings مع ربط المسارات بشكل صريح
          cat <<EOF > $HOME/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/build_tools = "34.0.0"
          EOF

          # تحديث ملف export_presets.cfg بالمسار المطلق الحقيقي
          sed -i 's|keystore/debug=.*|keystore/debug="'"$HOME"'/.android/debug.keystore"|g' export_presets.cfg
          sed -i 's|keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|g' export_presets.cfg
          sed -i 's|keystore/debug_password=.*|keystore/debug_password="android"|g' export_presets.cfg

      - name: Fix scripts syntax
        run: |
          sed -i 's/:=/=/g' scripts/*.gd || true

      - name: Godot Export
        uses: chickenbox/godot-export@v6
        with:
          godot_version: 4.3
          export_debug: true
          relative_project_path: ./
          archive_output: false

      - name: Organize Output
        run: |
          mkdir -p build
          mv build/Android/*.apk build/elah-alkhalq.apk 2>/dev/null || mv *.apk build/elah-alkhalq.apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: elah-alkhalq-apk
          path: build/*.apk
          if-no-files-found: error
