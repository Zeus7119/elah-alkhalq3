name: Build APK v2

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot 4.3 & Export Templates
        run: |
          # إنشاء مجلد القوالب بالمسار الذي يقرؤه Godot تلقائياً
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          mkdir -p $HOME/godot
          
          # تحميل وتشغيل محرك Godot 4.3
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d $HOME/godot
          chmod +x $HOME/godot/Godot_v4.3-stable_linux.x86_64
          
          # تحميل قوالب التصدير وفكها مباشرة في مجلد التصدير الخاص بالمحرك
          curl -sL -o /tmp/tp.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/tp.zip -d /tmp/tpl
          
          # نقل المحتويات بشكل دقيق
          if [ -d "/tmp/tpl/templates" ]; then
            mv /tmp/tpl/templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
          else
            mv /tmp/tpl/* $HOME/.local/share/godot/export_templates/4.3.stable/
          fi

      - name: Install Android SDK & Setup ADB
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools /tmp/cli
          curl -sL -o /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cli.zip -d /tmp/cli
          mv /tmp/cli/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          export ANDROID_HOME=$HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          
          $HOME/android-sdk/platform-tools/adb kill-server || true
          $HOME/android-sdk/platform-tools/adb start-server || true

      - name: Setup Keystore & Editor Settings
        run: |
          mkdir -p $HOME/.android $HOME/.config/godot
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          REAL_HOME=$(eval echo ~$USER)
          
          cat <<EOF > $HOME/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${REAL_HOME}/android-sdk"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${REAL_HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/build_tools = "34.0.0"
          EOF

      - name: Fix scripts syntax
        run: |
          sed -i 's/:=/=/g' scripts/*.gd || true

      - name: Export APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH
          
          adb start-server || true
          
          GODOT=$HOME/godot/Godot_v4.3-stable_linux.x86_64
          mkdir -p build
          
          # استيراد موارد المشروع
          $GODOT --headless --editor --quit --path . || true
          
          # تصدير ملف APK مع فحص الأخطاء
          $GODOT --headless --path . --export-debug "Android" build/elah-alkhalq.apk
          
          if [ ! -f build/elah-alkhalq.apk ]; then
            echo "❌ لم يتم إنشاء ملف APK"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elah-alkhalq-apk
          path: build/elah-alkhalq.apk
          if-no-files-found: error
